<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="https://example.com">
        <label for="name">name</label>
        <input id="name" placeholder="enter your name" type="text" />
        <input placeholder="enter your number" type="number" />
        <input type="password" />
        <input required type="email" />
        <input type="date" />
        <input type="submit" />
        <button type="button">Submit</button>
        <textarea> </textarea>
        <select>
            <option>option 1</option>
            <option>option 2</option>
            <option>option 3</option>
        </select>
    </form>
</body>
</html>

<!--
<form></form> - to create someting like login page etc
action="" -  it is an attribute used inside the form
<input/> - to give an input inside the form
type="" - type is an attribute used inside the input
placeholder="" - it is a attribute used inside the input to show the boxes what should be written there 
<label></label> - it act as a ref for the placeholder and type attribute
<button></button> - which acts as button to submit something
<textarea></textarea> - to write any text there but if we press enter it wont submit the form
<select></select> - to select a option
<option></option> - to add a type of option and it will show as dropdown menu
requried - mandatory to fill line in the form
